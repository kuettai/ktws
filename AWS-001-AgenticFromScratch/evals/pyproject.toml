[project]
name = "rst-evals"
version = "1.0.0"
description = "Evaluation set and scorer for the restaurant agent (Day 3, Lab 4)"
requires-python = ">=3.12"
dependencies = [
    "rst-agent",
    "pyyaml>=6",
    "boto3>=1.35",
]

[tool.uv]
package = false

[tool.uv.sources]
rst-agent = { path = "../solutions/agent", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
