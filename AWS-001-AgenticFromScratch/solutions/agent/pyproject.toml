[project]
name = "rst-agent"
version = "1.0.0"
description = "restaurant branch analyst agent (Strands Agents) that uses the restaurant MCP server's tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned: hooks, interrupts and the MCP client are used directly. strands-agents
    # 1.57 supports both mcp 1.x and 2.x client lines (it pins mcp<2.2).
    "strands-agents==1.57.2",
    # AgentCore Runtime entrypoint (runtime_app.py, Day 3 Module 05)
    "bedrock-agentcore==1.24.0",
]

[project.scripts]
rst-agent = "rst_agent.__main__:main"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
