          - M02 Runtime: AWS-001-AgenticFromScratch/day2/02-runtime.md
          - M03 Gateway: AWS-001-AgenticFromScratch/day2/03-gateway.md
          - M04 Identity: AWS-001-AgenticFromScratch/day2/04-identity.md
          - M05 Policy and observability: AWS-001-AgenticFromScratch/day2/05-policy-observability.md
          - M06 Capstone: AWS-001-AgenticFromScratch/day2/06-capstone.md
          - M07 Decision matrix: AWS-001-AgenticFromScratch/day2/07-decision-matrix.md
      - Day 3 - Agents and testing (preview):
          - M00 Agent fundamentals: AWS-001-AgenticFromScratch/day3/00-agent-fundamentals.md
          - M01 First agent: AWS-001-AgenticFromScratch/day3/01-first-agent.md
          - M02 Multi-step reasoning: AWS-001-AgenticFromScratch/day3/02-multi-step.md
          - M03 Human approval: AWS-001-AgenticFromScratch/day3/03-human-approval.md
          - M04 Testing agent behaviour: AWS-001-AgenticFromScratch/day3/04-evaluation.md
          - M05 Deploy the agent: AWS-001-AgenticFromScratch/day3/05-deploy-agent.md
          - M06 Capstone: AWS-001-AgenticFromScratch/day3/06-capstone.md
          - M07 Wrap-up: AWS-001-AgenticFromScratch/day3/07-wrap-up.md
      - Reference:
