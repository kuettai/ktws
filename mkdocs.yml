# Workshop website. Build: python3 build_site.py && mkdocs build --strict
site_name: ktws workshops
site_description: Hands-on workshops - MCP servers, AI agents and AWS
site_url: https://kuettai.github.io/ktws/
repo_url: https://github.com/kuettai/ktws
repo_name: kuettai/ktws
edit_uri: ""
docs_dir: _site_src
site_dir: _site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_javascript:
  - assets/diagram-zoom.js
extra_css:
  - assets/diagram-zoom.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

nav:
  - Home: index.md
  - AWS-001 Agentic from Scratch:
      - Overview: AWS-001-AgenticFromScratch/index.md
      - Plan:
          - Learning plan: AWS-001-AgenticFromScratch/learning-plan.md
          - Prerequisites: AWS-001-AgenticFromScratch/prereqs.md
          - Pre-event check: AWS-001-AgenticFromScratch/PREFLIGHT-CHECK.md
      - Pre-work:
          - Python reading primer: AWS-001-AgenticFromScratch/prework/python-reading-primer.md
          - Reviewing Kiro specs, steering and hooks: AWS-001-AgenticFromScratch/prework/kiro-guide.md
      - Day 1 - Build and secure an MCP server:
          - M00 MCP fundamentals: AWS-001-AgenticFromScratch/day1/00-mcp-fundamentals.md
          - M01 Hello MCP: AWS-001-AgenticFromScratch/day1/01-hello-mcp.md
          - M02 Redshift tools: AWS-001-AgenticFromScratch/day1/02-redshift-tools.md
          - M03 Wrap an internal API: AWS-001-AgenticFromScratch/day1/03-wrap-internal-api.md
          - M04 Go remote: AWS-001-AgenticFromScratch/day1/04-go-remote.md
          - M05 Deploy to ECS: AWS-001-AgenticFromScratch/day1/05-deploy-ecs.md
          - M06 Authentication: AWS-001-AgenticFromScratch/day1/06-auth.md
          - M07 End to end: AWS-001-AgenticFromScratch/day1/07-end-to-end.md
          - M08 Skills and agents: AWS-001-AgenticFromScratch/day1/08-skills-and-agents.md
      - Day 2 - Amazon Bedrock AgentCore (preview):
